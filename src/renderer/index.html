<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手写笔记</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════ 书架（Library） ═══════════ -->
<section id="shelf" class="screen">
  <header class="shelf-bar">
    <div class="shelf-head-left">
      <button id="btnFolderBack" class="ic hidden" title="返回上级"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="shelf-title" id="shelfTitle">我的笔记</span>
    </div>
    <div class="shelf-actions">
      <button id="btnNewFolder" class="pill-btn ghost">
        <svg viewBox="0 0 24 24" class="i16"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v4M10 13h4"/></svg>
        新建文件夹
      </button>
      <button id="btnNewNotebook" class="pill-btn">
        <svg viewBox="0 0 24 24" class="i16"><path d="M12 5v14M5 12h14"/></svg>
        新建笔记本
      </button>
    </div>
  </header>
  <div id="shelfGrid" class="shelf-grid"></div>
</section>

<!-- ═══════════ 编辑器（Editor） ═══════════ -->
<section id="editor" class="screen hidden">
  <!-- 顶栏：极简 iOS 风 -->
  <header id="topbar">
    <div class="tb-left">
      <button id="btnBack" class="ic" title="返回书架"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="btnPages" class="ic" title="页面"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M10 4v16"/></svg></button>
      <button id="btnBookmarks" class="ic" title="书签"><svg viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></svg></button>
      <button id="btnLocate" class="ic" title="定位/适应屏幕"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>
    <div class="tb-title" id="nbTitle" title="点击重命名">笔记本</div>
    <div class="tb-right">
      <button id="btnImport" class="ic" title="导入"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M5 21h14"/></svg></button>
      <button id="btnExport" class="ic" title="导出/分享"><svg viewBox="0 0 24 24"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M5 14v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg></button>
      <span class="tb-avatar">李</span>
      <button id="btnSearch" class="ic" title="搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></button>
      <button id="btnZoomFit" class="ic" title="适应屏幕"><svg viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4"/></svg></button>
      <span id="zoomVal" class="zoom">100%</span>
    </div>
    <!-- 导入/导出下拉 -->
    <div id="importMenu" class="dropdown">
      <button data-imp="image">导入图片…</button>
      <button data-imp="pdf">导入 PDF…</button>
      <button data-imp="xopp">导入 Xournal++ (.xopp)…</button>
    </div>
    <div id="exportMenu" class="dropdown">
      <button data-exp="png">当前页 PNG…</button>
      <button data-exp="jpg">当前页 JPG…</button>
      <button data-exp="pdf">整本 PDF…</button>
      <button data-exp="xopp">整本 Xournal++ (.xopp)…</button>
    </div>
  </header>

  <!-- 左侧抽屉：页面缩略图 -->
  <aside id="sidebar" class="drawer hidden">
    <div class="drawer-head">
      <span id="drawerTitle">页面</span>
      <button id="btnAddPage" class="ic small" title="新增页面"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="btnAddBookmark" class="ic small hidden" title="为当前页加/去书签"><svg viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></svg></button>
    </div>
    <div id="pageList" class="page-list"></div>
    <div id="bookmarkList" class="bookmark-list hidden"></div>
  </aside>

  <!-- 画布 -->
  <main id="stage">
    <div id="canvasWrap">
      <canvas id="paper"></canvas>
      <canvas id="ink"></canvas>
      <canvas id="overlay"></canvas>
      <div id="textLayer"></div>
      <div id="imageLayer"></div>
      <div id="coverLayer"></div>
      <div id="cardLayer"></div>
    </div>
    <!-- 套索选区浮动工具条 -->
    <div id="selBar" class="sel-bar hidden">
      <button id="selColor" class="sel-b" title="改颜色"><span class="sel-dot"></span>改色</button>
      <input type="color" id="selColorInput" value="#1c1c1e">
      <button id="selDup" class="sel-b" title="复制">复制</button>
      <button id="selDel" class="sel-b danger" title="删除"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button>
    </div>
  </main>

  <!-- 底部悬浮胶囊工具条（Note+ 核心视觉） -->
  <div id="dock">
    <button class="dk" id="btnUndo" title="撤销"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 5 5v1"/></svg></button>
    <button class="dk" id="btnRedo" title="重做"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0-5 5v1"/></svg></button>
    <span class="dk-sep"></span>
    <div id="penRack" class="pen-rack"></div>
    <span class="dk-sep"></span>
    <div id="dockTools" class="dock-tools"></div>
    <button class="dk more" id="btnMore" title="更多工具"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/></svg></button>
  </div>

  <!-- 截图笔：底部预览窗托盘（一排小缩略图） -->
  <div id="shotTray" class="shot-tray hidden"></div>

  <!-- 「更多」弹层：工具九宫格 / 我的笔 / 纸张模板 -->
  <div id="morePanel" class="popover hidden">
    <div class="pop-sec">
      <div class="pop-label pop-label-row"><span>工具</span>
        <button id="btnEditDock" class="pop-link">自定义笔盒</button>
      </div>
      <div id="toolGrid" class="tool-grid"></div>
    </div>
    <div class="pop-sec">
      <div class="pop-label pop-label-row"><span>我的笔</span>
        <button id="btnMultiEdit" class="pop-link">批量编辑</button>
      </div>
      <div id="myPens" class="my-pens"></div>
    </div>
    <div id="penEdit" class="pen-edit hidden">
      <div id="penKind" class="pen-kind">
        <button class="kind" data-kind="pen">笔</button>
        <button class="kind" data-kind="highlighter">荧光笔</button>
      </div>
      <div class="pop-row">
        <input type="color" id="colorCustom" value="#1c1c1e">
        <div id="palette" class="palette"></div>
      </div>
      <div class="pop-row">
        <span class="mini">粗细</span>
        <input type="range" id="sizeRange" min="1" max="24" value="3">
        <span id="sizeVal">3</span>
      </div>
      <div class="pop-row">
        <button id="btnEditPen" class="mini-btn">保存</button>
        <button id="btnDelPen" class="mini-btn danger">删除此笔</button>
      </div>
    </div>
    <div class="pop-sec" id="eraserSec">
      <div class="pop-label">橡皮擦</div>
      <div class="seg" id="eraserMode">
        <button class="seg-btn" data-mode="stroke">整笔擦除</button>
        <button class="seg-btn on" data-mode="pixel">局部擦除</button>
      </div>
      <div class="pop-row">
        <span class="mini">大小</span>
        <input type="range" id="eraserSize" min="8" max="60" value="18">
        <span id="eraserVal">18</span>
      </div>
    </div>
    <div class="pop-sec">
      <div class="pop-label">小工具</div>
      <div class="widget-row">
        <button id="btnCalc" class="widget-btn"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 18h4"/></svg><span>计算器</span></button>
        <button id="btnTimer" class="widget-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M9 2h6M12 5V2"/></svg><span>计时器</span></button>
      </div>
    </div>
    <div class="pop-sec">
      <div class="pop-label">纸张模板</div>
      <div id="tplGrid" class="tpl-grid"></div>
      <button id="btnNewTpl" class="mini-btn wide">＋ 自定义模板</button>
    </div>
  </div>

  <!-- 计算器面板 -->
  <div id="calcPanel" class="mini-app hidden">
    <div class="ma-head" id="calcHead"><span>计算器</span><button class="ma-x" id="calcClose">✕</button></div>
    <div class="calc-screen" id="calcScreen">0</div>
    <div class="calc-keys" id="calcKeys">
      <button data-k="C" class="ck fn">C</button><button data-k="←" class="ck fn">←</button><button data-k="%" class="ck fn">%</button><button data-k="/" class="ck op">÷</button>
      <button data-k="7" class="ck">7</button><button data-k="8" class="ck">8</button><button data-k="9" class="ck">9</button><button data-k="*" class="ck op">×</button>
      <button data-k="4" class="ck">4</button><button data-k="5" class="ck">5</button><button data-k="6" class="ck">6</button><button data-k="-" class="ck op">−</button>
      <button data-k="1" class="ck">1</button><button data-k="2" class="ck">2</button><button data-k="3" class="ck">3</button><button data-k="+" class="ck op">+</button>
      <button data-k="0" class="ck zero">0</button><button data-k="." class="ck">.</button><button data-k="=" class="ck eq">=</button>
    </div>
  </div>

  <!-- 计时器面板 -->
  <div id="timerPanel" class="mini-app hidden">
    <div class="ma-head" id="timerHead"><span>计时器</span><button class="ma-x" id="timerClose">✕</button></div>
    <div class="timer-display" id="timerDisplay">00:00</div>
    <div class="timer-mode seg" id="timerModeSeg">
      <button class="seg-btn on" data-tm="stopwatch">正计时</button>
      <button class="seg-btn" data-tm="countdown">倒计时</button>
    </div>
    <div class="timer-set hidden" id="timerSet">
      <button class="mini-btn" data-add="60">+1分</button>
      <button class="mini-btn" data-add="300">+5分</button>
      <button class="mini-btn" data-add="600">+10分</button>
    </div>
    <div class="timer-ctrl">
      <button id="timerStart" class="mini-btn">开始</button>
      <button id="timerReset" class="mini-btn danger">重置</button>
    </div>
  </div>
</section>

<!-- ═══════════ 自定义模板编辑器 ═══════════ -->
<div id="tplEditor" class="tpl-editor hidden">
  <div class="te-card">
    <div class="te-head">
      <button id="teCancel" class="te-x">取消</button>
      <span class="te-title">自定义模板</span>
      <button id="teSave" class="te-save">保存</button>
    </div>
    <div class="te-body">
      <div class="te-preview-wrap"><canvas id="tePreview" width="300" height="424"></canvas>
        <div id="teGuideHint" class="te-hint hidden">点击预览添加参考线</div>
      </div>
      <div class="te-controls">
        <label class="te-field"><span>名称</span><input type="text" id="teName" placeholder="我的模板" value="我的模板"></label>
        <div class="te-field"><span>底纹</span>
          <div class="seg te-base" id="teBase">
            <button class="seg-btn on" data-base="blank">空白</button>
            <button class="seg-btn" data-base="lined">横线</button>
            <button class="seg-btn" data-base="grid">网格</button>
            <button class="seg-btn" data-base="dots">点阵</button>
          </div>
        </div>
        <label class="te-field te-slider"><span>密度 <em id="teSpacingVal">46</em></span>
          <input type="range" id="teSpacing" min="20" max="90" value="46"></label>
        <div class="te-field te-colors">
          <label><span>纸色</span><input type="color" id="tePaper" value="#ffffff"></label>
          <label><span>线色</span><input type="color" id="teLine" value="#c9d6e5"></label>
          <label><span>参考线色</span><input type="color" id="teGuideColor" value="#e2453b"></label>
        </div>
        <div class="te-field te-guides">
          <span>参考线</span>
          <div class="te-guide-btns">
            <button id="teAddH" class="mini-btn">＋ 水平线</button>
            <button id="teAddV" class="mini-btn">＋ 垂直线</button>
            <button id="teClearG" class="mini-btn danger">清空</button>
          </div>
          <div id="teGuideList" class="te-guide-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════ 自定义笔盒（编辑工具盘） ═══════════ -->
<div id="dockEditor" class="tpl-editor hidden">
  <div class="te-card dock-editor-card">
    <div class="te-head">
      <button id="deCancel" class="te-x">取消</button>
      <span class="te-title">自定义笔盒</span>
      <button id="deSave" class="te-save">完成</button>
    </div>
    <div class="de-body">
      <div class="de-hint">勾选要放进底部笔盒的工具，拖动 ☰ 调整顺序。未勾选的仍可在「更多」里使用。</div>
      <div id="deList" class="de-list"></div>
    </div>
  </div>
</div>

<!-- ═══════════ 批量编辑笔 ═══════════ -->
<div id="penMultiEditor" class="tpl-editor hidden">
  <div class="te-card pme-card">
    <div class="te-head">
      <button id="pmeDone" class="te-x">关闭</button>
      <span class="te-title">批量编辑笔</span>
      <button id="pmeApply" class="te-save">应用到选中</button>
    </div>
    <div class="pme-body">
      <div class="de-hint">点笔可多选（再点取消）。下方设置会统一应用到所有选中的笔；也可连续单独调整。</div>
      <div id="pmePens" class="pme-pens"></div>
      <div class="pme-controls">
        <div class="pop-row">
          <span class="mini">类型</span>
          <div id="pmeKind" class="pen-kind">
            <button class="kind" data-kind="pen">笔</button>
            <button class="kind" data-kind="highlighter">荧光笔</button>
            <button class="kind" data-kind="keep">保持</button>
          </div>
        </div>
        <div class="pop-row">
          <input type="color" id="pmeColor" value="#1c1c1e">
          <div id="pmePalette" class="palette"></div>
        </div>
        <div class="pop-row">
          <span class="mini">粗细</span>
          <input type="range" id="pmeSize" min="1" max="24" value="3">
          <span id="pmeSizeVal">3</span>
        </div>
        <div class="pop-row">
          <button id="pmeSelAll" class="mini-btn">全选</button>
          <button id="pmeDel" class="mini-btn danger">删除选中</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════ 通用弹出菜单（笔记本 ⋯） ═══════════ -->
<div id="ctxMenu" class="ctx-menu hidden"></div>

<!-- ═══════════ 通用 iOS 模态框 ═══════════ -->
<div id="modalMask" class="modal-mask hidden">
  <div class="modal-card" id="modalCard">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-desc" id="modalDesc"></div>
    <input type="text" class="modal-input hidden" id="modalInput">
    <div class="modal-swatches hidden" id="modalSwatches"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" id="modalCancel">取消</button>
      <button class="modal-btn ok" id="modalOk">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="busy" class="busy hidden"><div class="spinner"></div><span id="busyText">处理中…</span></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="renderer.js"></script>
</body>
</html>
