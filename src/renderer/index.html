<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手写笔记</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════ 书架（Library） ═══════════ -->
<section id="shelf" class="screen">
  <header class="shelf-bar">
    <span class="shelf-title">我的笔记</span>
    <button id="btnNewNotebook" class="pill-btn">＋ 新建笔记本</button>
  </header>
  <div id="shelfGrid" class="shelf-grid"></div>
</section>

<!-- ═══════════ 编辑器（Editor） ═══════════ -->
<section id="editor" class="screen hidden">
  <!-- 顶栏：极简 iOS 风 -->
  <header id="topbar">
    <div class="tb-left">
      <button id="btnBack" class="ic" title="返回书架">‹</button>
      <button id="btnPages" class="ic" title="页面">▤</button>
      <button id="btnBookmarks" class="ic" title="书签">🔖</button>
    </div>
    <div class="tb-title" id="nbTitle" title="点击重命名">笔记本</div>
    <div class="tb-right">
      <button id="btnBookmarkPage" class="ic" title="给本页加/去书签">☆</button>
      <button id="btnImport" class="ic" title="导入">⤓</button>
      <button id="btnExport" class="ic" title="导出">⤒</button>
      <button id="btnZoomFit" class="ic" title="适应屏幕">⤢</button>
      <span id="zoomVal" class="zoom">100%</span>
    </div>
    <!-- 导入/导出下拉 -->
    <div id="importMenu" class="dropdown">
      <button data-imp="image">导入图片…</button>
      <button data-imp="pdf">导入 PDF…</button>
      <button data-imp="xopp">导入 Xournal++ (.xopp)…</button>
    </div>
    <div id="exportMenu" class="dropdown">
      <button data-exp="png">当前页 PNG…</button>
      <button data-exp="jpg">当前页 JPG…</button>
      <button data-exp="pdf">整本 PDF…</button>
      <button data-exp="xopp">整本 Xournal++ (.xopp)…</button>
    </div>
  </header>

  <!-- 左侧抽屉：页面缩略图 -->
  <aside id="sidebar" class="drawer hidden">
    <div class="drawer-head">
      <span id="drawerTitle">页面</span>
      <button id="btnAddPage" class="ic small" title="新增页面">＋</button>
    </div>
    <div id="pageList" class="page-list"></div>
    <div id="bookmarkList" class="bookmark-list hidden"></div>
  </aside>

  <!-- 画布 -->
  <main id="stage">
    <div id="canvasWrap">
      <canvas id="paper"></canvas>
      <canvas id="ink"></canvas>
      <canvas id="overlay"></canvas>
      <div id="textLayer"></div>
    </div>
  </main>

  <!-- 底部悬浮胶囊工具条（Note+ 核心视觉） -->
  <div id="dock">
    <button class="dk undo" id="btnUndo" title="撤销">↩</button>
    <button class="dk redo" id="btnRedo" title="重做">↪</button>
    <span class="dk-sep"></span>
    <div id="penRack" class="pen-rack"></div>
    <button class="dk addpen" id="btnAddPen" title="存入当前笔">＋</button>
    <span class="dk-sep"></span>
    <button class="dk tool" data-tool="eraser" id="tEraser" title="橡皮擦">▱</button>
    <button class="dk tool" data-tool="lasso" id="tLasso" title="套索选择">◌</button>
    <button class="dk tool" data-tool="text" id="tText" title="文本框">T</button>
    <button class="dk tool" data-tool="shape" id="tShape" title="形状识别">△</button>
    <button class="dk tool" data-tool="pan" id="tPan" title="移动画布">✋</button>
    <button class="dk more" id="btnMore" title="更多">•••</button>
  </div>

  <!-- 「更多」弹层：笔设置 / 纸张模板 -->
  <div id="morePanel" class="popover hidden">
    <div class="pop-sec">
      <div class="pop-label">当前笔</div>
      <div class="pop-row">
        <input type="color" id="colorCustom" value="#1a1a1a">
        <div id="palette" class="palette"></div>
      </div>
      <div class="pop-row">
        <span class="mini">粗细</span>
        <input type="range" id="sizeRange" min="1" max="24" value="3">
        <span id="sizeVal">3</span>
      </div>
      <div class="pop-row">
        <button id="btnEditPen" class="mini-btn">更新此笔</button>
        <button id="btnDelPen" class="mini-btn">删除此笔</button>
      </div>
    </div>
    <div class="pop-sec">
      <div class="pop-label">纸张模板</div>
      <div id="tplGrid" class="tpl-grid"></div>
      <button id="btnNewTpl" class="mini-btn wide">＋ 自创模板…</button>
    </div>
  </div>
</section>

<div id="toast" class="toast"></div>
<div id="busy" class="busy hidden"><div class="spinner"></div><span id="busyText">处理中…</span></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="renderer.js"></script>
</body>
</html>
