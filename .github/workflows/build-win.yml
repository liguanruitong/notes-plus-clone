name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm install
      - name: 打包 exe
        run: npm run dist:win

      # 打包产物自检：确认 Electron 运行时（尤其 ffmpeg.dll）完整打进产物
      - name: 打包产物自检（ffmpeg.dll + exe 体积）
        shell: pwsh
        run: |
          Write-Host "===== release/ 目录树 ====="
          Get-ChildItem -Recurse release | Select-Object FullName, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize | Out-String -Width 4096 | Write-Host

          $fail = $false

          # 1) 权威校验：win-unpacked 是 portable exe 的打包源，它里面有完整 Electron 运行时，
          #    portable 就必然含完整运行时。这里逐一核对关键 dll（尤其 ffmpeg.dll）。
          $unpacked = "release/win-unpacked"
          if (Test-Path $unpacked) {
            $ffmpeg = Join-Path $unpacked "ffmpeg.dll"
            if (Test-Path $ffmpeg) {
              $sz = [math]::Round((Get-Item $ffmpeg).Length/1MB,2)
              Write-Host "✅ win-unpacked 含 ffmpeg.dll ($sz MB)"
            } else {
              Write-Host "❌ win-unpacked 缺少 ffmpeg.dll —— Electron 运行时未完整打包！"
              $fail = $true
            }
            foreach ($dll in @("libEGL.dll","libGLESv2.dll","d3dcompiler_47.dll","vk_swiftshader.dll","vulkan-1.dll")) {
              if (Test-Path (Join-Path $unpacked $dll)) { Write-Host "  ✅ $dll" }
              else { Write-Host "  ❌ 缺少 $dll"; $fail = $true }
            }
          } else {
            Write-Host "❌ 未找到 release/win-unpacked —— 无法确认运行时完整性"
            $fail = $true
          }

          # 2) portable exe 存在性 + 体积下限（portable 是 NSIS 自解压包，运行时被压进
          #    嵌套的 $PLUGINSDIR/app-64.7z，flat 列表看不到，故只做体积下限 sanity）
          $exe = Get-ChildItem release -Filter *.exe | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) {
            Write-Host "❌ release/ 下没有生成 exe"
            $fail = $true
          } else {
            $exeMB = [math]::Round($exe.Length/1MB,2)
            Write-Host "📦 产物 exe: $($exe.Name) = $exeMB MB"
            if ($exe.Length -lt 50MB) {
              Write-Host "❌ exe 仅 $exeMB MB（< 50MB）—— 压缩后仍过小，运行时疑似缺失！"
              $fail = $true
            } else {
              Write-Host "✅ exe 体积合理（NSIS 压缩后含完整运行时约 70MB 属正常）"
            }
          }

          # 3) 尽力而为：解出 NSIS 内嵌 app-64.7z 并证明 ffmpeg.dll 确在 exe 内部（不作硬门槛）
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if ($exe -and (Test-Path $sevenZip)) {
            $tmp = Join-Path $env:RUNNER_TEMP "nsis_probe"
            & $sevenZip x "$($exe.FullName)" "-o$tmp" -y '$PLUGINSDIR/app-64.7z' 2>$null | Out-Null
            $inner = Join-Path $tmp '$PLUGINSDIR/app-64.7z'
            if (Test-Path $inner) {
              $listing = & $sevenZip l "$inner" 2>$null | Out-String
              if ($listing -match "ffmpeg\.dll") {
                Write-Host "✅ 已从 exe 内嵌 app-64.7z 中确认 ffmpeg.dll —— 真机不会再报缺 dll"
              } else {
                Write-Host "⚠️ 未能在内嵌归档列表中匹配 ffmpeg.dll（仅提示，不阻断；以 win-unpacked 校验为准）"
              }
            } else {
              Write-Host "ℹ️ 未能解出内嵌 app-64.7z（NSIS 结构差异），跳过深层证明；以 win-unpacked 校验为准"
            }
          }

          if ($fail) {
            Write-Host "::error::打包产物自检失败：Electron 运行时不完整，拒绝发布。"
            exit 1
          }
          Write-Host "🎉 打包产物自检通过。"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: notes-plus-windows
          path: release/*.exe
          if-no-files-found: error
      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
