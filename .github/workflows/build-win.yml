name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm install
      - name: 打包 exe
        run: npm run dist:win

      # 打包产物自检：确认 Electron 运行时（尤其 ffmpeg.dll）完整打进产物
      - name: 打包产物自检（ffmpeg.dll + exe 体积）
        shell: pwsh
        run: |
          Write-Host "===== release/ 目录树 ====="
          Get-ChildItem -Recurse release | Select-Object FullName, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize | Out-String -Width 4096 | Write-Host

          $fail = $false

          # 1) 校验 win-unpacked 里的 Electron 运行时 dll
          $unpacked = "release/win-unpacked"
          if (Test-Path $unpacked) {
            $ffmpeg = Join-Path $unpacked "ffmpeg.dll"
            if (Test-Path $ffmpeg) {
              $sz = [math]::Round((Get-Item $ffmpeg).Length/1MB,2)
              Write-Host "✅ 找到 ffmpeg.dll ($sz MB) @ $ffmpeg"
            } else {
              Write-Host "❌ win-unpacked 中缺少 ffmpeg.dll —— Electron 运行时未完整打包！"
              $fail = $true
            }
            # 其它关键运行时文件
            foreach ($dll in @("libEGL.dll","libGLESv2.dll","d3dcompiler_47.dll","vk_swiftshader.dll")) {
              if (Test-Path (Join-Path $unpacked $dll)) { Write-Host "  ✅ $dll" }
              else { Write-Host "  ⚠️ 缺少 $dll"; }
            }
          } else {
            Write-Host "⚠️ 未找到 release/win-unpacked（portable 可能已清理中间目录），改为仅校验 exe 体积"
          }

          # 2) 直接证明 portable exe 内部确实打进了 ffmpeg.dll
          # portable 是 7z 自解压包，压缩后 ~70MB 属正常（内部解压 ~200MB 的 win-unpacked）；
          # 因此不用体积猜，而用 7z 列出归档内容直接核对 ffmpeg.dll 是否在包里。
          $exe = Get-ChildItem release -Filter *.exe | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) {
            Write-Host "❌ release/ 下没有生成 exe"
            $fail = $true
          } else {
            $exeMB = [math]::Round($exe.Length/1MB,2)
            Write-Host "📦 产物 exe: $($exe.Name) = $exeMB MB"
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
            if (Test-Path $sevenZip) {
              $listing = & $sevenZip l "$($exe.FullName)" 2>$null | Out-String
              if ($listing -match "ffmpeg\.dll") {
                Write-Host "✅ 已确认 ffmpeg.dll 打进 portable exe 归档内部"
              } else {
                Write-Host "❌ portable exe 归档内部找不到 ffmpeg.dll —— 真机会报找不到 ffmpeg.dll！"
                $fail = $true
              }
            } else {
              # 无 7z 时退回体积下限校验（compressed portable 至少应有数十 MB 的运行时）
              Write-Host "⚠️ 未找到 7z，退回体积下限校验（>=60MB）"
              if ($exe.Length -lt 60MB) { Write-Host "❌ exe 仅 $exeMB MB，运行时疑似缺失"; $fail = $true }
              else { Write-Host "✅ exe 体积合理" }
            }
          }

          if ($fail) {
            Write-Host "::error::打包产物自检失败：Electron 运行时不完整，拒绝发布。"
            exit 1
          }
          Write-Host "🎉 打包产物自检通过。"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: notes-plus-windows
          path: release/*.exe
          if-no-files-found: error
      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
